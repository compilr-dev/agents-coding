name: Feature Request
description: Suggest a new feature or improvement for @compilr-dev/agents-coding
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for the coding tools? We'd love to hear it.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem does this solve?
      placeholder: "I need my agent to understand ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part does this relate to?
      options:
        - Git Tools
        - Smart Runners
        - Code Search
        - TypeScript/JavaScript Analysis
        - Python Analysis
        - Go Analysis
        - New Language Support
        - Skills
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered other approaches?
